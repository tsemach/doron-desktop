services:
  postgres:
    image: postgres:16-alpine
    container_name: ascurix-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: doron_db
    ports:
      # Bound to loopback only (not 0.0.0.0) so a worktree's ascurix-managed
      # Postgres instance can bind its own 127.0.0.x alias on the same port
      # without colliding with this one (see ASC-178, packages/ascurix).
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    driver: local
