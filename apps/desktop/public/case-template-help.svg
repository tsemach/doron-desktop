<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="100%" height="100%" style="background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Shadows -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
    <filter id="shadow-md" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.1" />
    </filter>

    <!-- Markers -->
    <marker id="arrowhead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrowhead-accent" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arrowhead-success" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#16a34a" />
    </marker>

    <!-- Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Title Section -->
  <text x="550" y="45" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Case Template Generation Workflow</text>

  <!-- STEP 1: DOCUMENT TEMPLATES -->
  <g transform="translate(60, 90)">
    <!-- Container Card -->
    <rect x="0" y="0" width="250" height="340" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
    <text x="125" y="36" text-anchor="middle" font-size="14" font-weight="700" fill="#475569" letter-spacing="0.5">1. DOCUMENT TEMPLATES</text>

    <!-- Template 1 -->
    <rect x="25" y="60" width="200" height="48" rx="24" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
    <text x="125" y="89" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">doc-template-1</text>

    <!-- Template 2 -->
    <rect x="25" y="124" width="200" height="48" rx="24" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
    <text x="125" y="153" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">doc-template-2</text>

    <!-- Dots -->
    <circle cx="125" cy="194" r="3" fill="#94a3b8" />
    <circle cx="125" cy="206" r="3" fill="#94a3b8" />
    <circle cx="125" cy="218" r="3" fill="#94a3b8" />

    <!-- Template N -->
    <rect x="25" y="240" width="200" height="48" rx="24" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
    <text x="125" y="269" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">doc-template-n</text>
  </g>

  <!-- Grouping Bracket for Templates -->
  <path d="M 325 140 L 345 140 L 345 260 L 365 260 L 345 260 L 345 380 L 325 380" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Flow Arrow 1 -> 2 -->
  <g transform="translate(375, 260)">
    <line x1="0" y1="0" x2="65" y2="0" stroke="#2563eb" stroke-width="3" />
    <polygon points="65,-6 77,0 65,6" fill="#2563eb" />
  </g>

  <!-- Annotation 1: Word file with placeholders -->
  <g transform="translate(185, 460)">
    <path d="M 0 0 L 0 -70" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowhead)" />
    <rect x="-125" y="0" width="250" height="70" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <text x="0" y="28" text-anchor="middle" font-size="13" font-weight="500" fill="#334155">Word files with placeholders like</text>
    <rect x="-65" y="38" width="130" height="22" rx="4" fill="#e2e8f0" />
    <text x="0" y="53" text-anchor="middle" font-size="12" font-family="monospace" font-weight="700" fill="#0f172a">{{ full-name }}</text>
  </g>

  <!-- STEP 2: CASE TEMPLATE (CENTER BOX) -->
  <g transform="translate(465, 160)">
    <!-- Blue Box Outer Shell -->
    <rect x="0" y="0" width="200" height="200" rx="28" fill="url(#primary-grad)" filter="url(#shadow-md)" />
    <!-- Inner Border Line -->
    <rect x="8" y="8" width="184" height="184" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" />
    
    <!-- Clean Box Icon with Proper Spacing -->
    <g transform="translate(76, 28)">
      <!-- Lid -->
      <rect x="0" y="0" width="48" height="12" rx="2" fill="#ffffff" />
      <!-- Box Body -->
      <path d="M 3 15 L 45 15 C 46.5 15 48 16.5 48 18 L 45 42 C 45 43.5 43.5 45 42 45 L 6 45 C 4.5 45 3 43.5 3 42 L 0 18 C 0 16.5 1.5 15 3 15 Z" fill="#ffffff" />
      <!-- Handle Hole -->
      <rect x="17" y="23" width="14" height="6" rx="3" fill="#2563eb" />
    </g>
    
    <!-- Appropriately Spaced Text Below Icon -->
    <text x="100" y="112" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="1">CASE</text>
    <text x="100" y="142" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff" letter-spacing="1">TEMPLATE</text>
  </g>

  <!-- Annotation 2: Enter fields once -->
  <g transform="translate(565, 460)">
    <path d="M 0 0 L 0 -80" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowhead-accent)" />
    <rect x="-110" y="0" width="220" height="54" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
    <text x="0" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">Enter fields once</text>
    <text x="0" y="42" text-anchor="middle" font-size="12" font-weight="500" fill="#3b82f6">across all documents</text>
  </g>

  <!-- Flow Arrow 2 -> 3 -->
  <g transform="translate(680, 260)">
    <line x1="0" y1="0" x2="65" y2="0" stroke="#16a34a" stroke-width="3" />
    <polygon points="65,-6 77,0 65,6" fill="#16a34a" />
  </g>

  <!-- STEP 3: GENERATED DOCUMENTS (YOUR CASE DOCS) -->
  <g transform="translate(770, 90)">
    <!-- Container Card -->
    <rect x="0" y="0" width="250" height="340" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />
    <text x="125" y="36" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d" letter-spacing="0.5">3. YOUR CASE DOCS</text>

    <!-- Document 1 -->
    <rect x="25" y="60" width="200" height="48" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" />
    <text x="125" y="89" text-anchor="middle" font-size="14" font-weight="600" fill="#166534">document-1</text>

    <!-- Document 2 -->
    <rect x="25" y="124" width="200" height="48" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" />
    <text x="125" y="153" text-anchor="middle" font-size="14" font-weight="600" fill="#166534">document-2</text>

    <!-- Dots -->
    <circle cx="125" cy="194" r="3" fill="#94a3b8" />
    <circle cx="125" cy="206" r="3" fill="#94a3b8" />
    <circle cx="125" cy="218" r="3" fill="#94a3b8" />

    <!-- Document N -->
    <rect x="25" y="240" width="200" height="48" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" />
    <text x="125" y="269" text-anchor="middle" font-size="14" font-weight="600" fill="#166534">document-n</text>
  </g>

  <!-- Annotation 3: Your case is ready -->
  <g transform="translate(895, 460)">
    <path d="M 0 0 L 0 -70" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowhead-success)" />
    <rect x="-90" y="0" width="180" height="54" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" />
    <text x="0" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">Your case is ready!</text>
    <text x="0" y="42" text-anchor="middle" font-size="12" font-weight="500" fill="#22c55e">Fully populated files</text>
  </g>

  <!-- BOTTOM NUMBERED CIRCLES (1, 2, 3 ALIGNED ON A SINGLE AXIS) -->
  <!-- Connecting Line -->
  <line x1="185" y1="620" x2="895" y2="620" stroke="#cbd5e1" stroke-width="2" />

  <!-- Circle 1 -->
  <g transform="translate(185, 620)">
    <circle cx="0" cy="0" r="24" fill="#2563eb" />
    <text x="0" y="8" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">1</text>
  </g>

  <!-- Circle 2 (Now horizontally aligned with 1 and 3) -->
  <g transform="translate(565, 620)">
    <circle cx="0" cy="0" r="24" fill="#2563eb" />
    <text x="0" y="8" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">2</text>
  </g>

  <!-- Circle 3 -->
  <g transform="translate(895, 620)">
    <circle cx="0" cy="0" r="24" fill="#16a34a" />
    <text x="0" y="8" text-anchor="middle" font-size="20" font-weight="800" fill="#ffffff">3</text>
  </g>
</svg>
